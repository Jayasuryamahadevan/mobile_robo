name: Go CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy
      - run: gofmt -w cmd internal
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/memoryd ./cmd/memoryworker ./cmd/devtoken
