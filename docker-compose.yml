# Developer-only deployment. TLS, private broker credentials, non-owner DB roles,
# and HA broker/PostgreSQL are required for production.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: memory
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memory_dev_only}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./db/migrations/002_cqrs_jetstream.sql:/docker-entrypoint-initdb.d/002_cqrs_jetstream.sql:ro
      - ./db/migrations/003_security_roles.sql:/docker-entrypoint-initdb.d/003_security_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U memory -d memory"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server","--save","","--appendonly","no","--maxmemory","256mb","--maxmemory-policy","volatile-lru"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  nats:
    image: nats:2.11-alpine
    command: ["--jetstream","--store_dir","/data","--http_port","8222"]
    ports: ["127.0.0.1:4222:4222","127.0.0.1:8222:8222"]
    volumes: [natsdata:/data]
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]
    profiles: ["advanced"]
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
    ports: ["127.0.0.1:7474:7474","127.0.0.1:7687:7687"]
    volumes: [neo4jdata:/data]
    profiles: ["advanced"]
  ollama:
    image: ollama/ollama:latest
    volumes: [ollamadata:/root/.ollama]
    ports: ["127.0.0.1:11434:11434"]
    profiles: ["advanced"]
  memoryd:
    build: .
    env_file: .env
    environment: &memory_env
      DATABASE_URL: postgres://memory:${POSTGRES_PASSWORD:-memory_dev_only}@postgres:5432/memory?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      NEO4J_URL: http://neo4j:7474
      PORT: 8080
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  memoryrelay:
    build: .
    entrypoint: ["/memoryrelay"]
    env_file: .env
    environment: *memory_env
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_started}
    restart: unless-stopped
  memoryprojector:
    build: .
    entrypoint: ["/memoryprojector"]
    env_file: .env
    environment: *memory_env
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_started}
    restart: unless-stopped
  # Legacy poller is strictly opt-in and must not run with memoryprojector.
  memoryworker:
    build: .
    entrypoint: ["/memoryworker"]
    env_file: .env
    environment: *memory_env
    profiles: ["legacy-worker"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  pgdata:
  natsdata:
  qdrantdata:
  neo4jdata:
  ollamadata:
